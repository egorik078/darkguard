version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: subconverter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass_2026}
      POSTGRES_DB: subconverter_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subconverter-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres_secure_pass_2026}@postgres:5432/subconverter_db
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-SubConv3rt3r2026!SecurePass}
      CRON_SECRET: ${CRON_SECRET:-cron_s3cr3t_k3y_2026_subconv3rt3r}
      NEXT_PUBLIC_APP_NAME: SubConverter Dashboard
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Cron job for auto-refresh (optional, can be external cron)
  # Uncomment if you want built-in cron
  # cron:
  #   image: curlimages/curl:latest
  #   container_name: subconverter-cron
  #   restart: unless-stopped
  #   depends_on:
  #     - app
  #   entrypoint: /bin/sh
  #   command: -c "while true; do sleep 1800; curl -H 'Authorization: Bearer ${CRON_SECRET:-cron_s3cr3t_k3y_2026_subconv3rt3r}' http://app:3000/api/cron/refresh-sublinks; done"

volumes:
  postgres_data:
    driver: local
